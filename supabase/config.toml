# Supabase project configuration — DreamBreaker PB
# https://supabase.com/docs/reference/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
# NOTE: this file configures the LOCAL stack (`supabase start`) only. The hosted
# projects read their auth settings from the Supabase Dashboard, so the
# localhost URLs below are correct here and must NOT be replaced with production
# URLs — doing so breaks local development without changing production at all.
#
# Production/staging equivalents must be set in Dashboard → Authentication →
# URL Configuration, and are NOT provable from this repo:
#   Site URL:        the deployed web origin
#   Redirect allow-list must include, at minimum:
#     - <web origin>/auth/callback        (web OAuth, see web/src/app/auth/callback/route.ts)
#     - dreambreaker://                   (mobile OAuth return, makeRedirectUri() in lib/auth.ts)
#     - dreambreaker://reset-password     (password recovery deep link)
#     - https://pickleballapp.app/**      (universal links, see lib/appLinks.ts)
#     - exp://** for Expo Go / dev-client testing, if used
# Google/Apple provider client IDs and secrets are also Dashboard-side for hosted
# projects; the env() references below only resolve for the local stack.
# See TODO1.1_EXECUTION_PLAN.md item 1.2 for the full verification checklist.
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[realtime]
enabled = true

[edge_runtime]
enabled = true

# Storage buckets — provisioned by migration or dashboard
# tournament-covers: public read, 5MB max, images only
# player-avatars:    public read, 2MB max, images only
