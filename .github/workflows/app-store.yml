# App Store listing, screenshots and submission via fastlane (see
# fastlane/Fastfile). Manual only: every run but capture-screenshots writes to
# App Store Connect, and `submit` sends the app to review. Builds stay on EAS.
#
# capture-screenshots builds a SIMULATOR app here (expo prebuild + xcodebuild)
# instead of on EAS: adding a simulator profile to eas.json moves the mobile
# fingerprint (9ad75807 -> 8b90d139, measured 2026-10-29) and would cut build 14
# off from OTA updates. The prebuilt ios/ folder never leaves the runner.

name: app-store

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "screenshots = upload the framed images committed in fastlane/screenshots/en-US; capture-screenshots = take raw simulator screenshots (artifact only, unless upload is ticked); metadata = listing text; submit = attach build and submit for review"
        required: true
        type: choice
        options: [screenshots, capture-screenshots, metadata, submit]
      upload:
        description: "capture-screenshots only: also replace the screenshots in App Store Connect. Leave off until you have checked the artifact."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  capture:
    if: inputs.lane == 'capture-screenshots'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Same values as the EAS production environment. No PostHog or Sentry
      # keys, so screenshot sessions do not pollute analytics or crash reports.
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_IOS_API_KEY }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SIMULATOR: iPhone 16 Pro Max
    steps:
      - uses: actions/checkout@v4
      # Node 24: apps/mobile's lockfile needs npm 10+ (see checks.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: apps/mobile
        run: npm ci
      - name: Prebuild iOS
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
      - name: Build for simulator
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          # The keychain needs application-identifier/keychain-access-groups.
          # Unsigned (CODE_SIGNING_ALLOWED=NO) the app has neither and
          # SecureStore fails with -34018, so the Supabase session never loads.
          # An ad-hoc codesign carrying them is refused by the host's AMFI
          # (spawn error 162), and Sign to Run Locally without a team adds
          # nothing. The simulator reads entitlements from the binary's
          # __TEXT,__entitlements section, which is how Xcode does it, so link
          # them in directly.
          cat > "$PWD/sim.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>ZSH27U747N.app.pickleballapp</string>
            <key>keychain-access-groups</key><array><string>ZSH27U747N.app.pickleballapp</string></array>
          </dict></plist>
          PLIST
          # App target only (its Pods xcconfig), so Pods' own link flags stay.
          XC="Pods/Target Support Files/Pods-$SCHEME/Pods-$SCHEME.release.xcconfig"
          sed -i '' "s|^OTHER_LDFLAGS = |OTHER_LDFLAGS = -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker $PWD/sim.entitlements |" "$XC"
          grep -q sim.entitlements "$XC" || { echo "::error::could not patch $XC"; exit 1; }
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -50
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          BIN="$APP/$(basename "$APP" .app)"
          echo "--- __entitlements in $BIN"
          otool -X -s __TEXT __entitlements "$BIN" | head -5 || true
          # Fail here, not 10 minutes later in Maestro.
          grep -q keychain-access-groups "$BIN" \
            || { echo "::error::simulator build has no keychain entitlement"; exit 1; }
          echo "APP_PATH=$PWD/$APP" >> "$GITHUB_ENV"
      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR"
          xcrun simctl bootstatus "$SIMULATOR" -b
          xcrun simctl status_bar booted override --time 9:41 \
            --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 --dataNetwork wifi
          xcrun simctl location booted set 27.4989,-82.5748
          xcrun simctl install booted "$APP_PATH"
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Capture
        run: |
          mkdir -p screenshots
          cd screenshots
          maestro --version
          maestro test ../.maestro/app-store-screenshots.yaml \
            -e EMAIL="dhjesus122+tyler@gmail.com" -e PASSWORD="$REVIEW_DEMO_PASSWORD" \
            --test-output-dir ../maestro-output
        env:
          REVIEW_DEMO_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: |
            screenshots/*.png
            .maestro/*.png
            maestro-output/**
      # 00-home is a reference shot, not a store screenshot.
      - name: Stage for upload
        if: inputs.upload
        run: |
          rm -f fastlane/screenshots/en-US/*.png
          find screenshots .maestro -maxdepth 1 -name '[0-9][0-9]-*.png' ! -name '00-*' -exec cp {} fastlane/screenshots/en-US/ \;
          ls -l fastlane/screenshots/en-US
      - uses: ruby/setup-ruby@v1
        if: inputs.upload
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Upload screenshots
        if: inputs.upload
        run: bundle exec fastlane ios screenshots
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          REVIEW_DEMO_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}
          REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"

  deliver:
    if: inputs.lane != 'capture-screenshots'
    # deliver only talks to the App Store Connect API, so it needs no Mac.
    # macos-15 jobs sat unassigned until GitHub cancelled them (2026-11-04).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: fastlane ${{ inputs.lane }}
        run: bundle exec fastlane ios "$LANE"
        env:
          LANE: ${{ inputs.lane }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          REVIEW_DEMO_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}
          REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
