# Static checks. The first CI in this repo.
#
# Every check here already existed and was passing locally — the problem was
# that nothing ran them. `deno check` was never wired in, and nine of fifteen
# edge functions were failing it silently for weeks (see
# TODO1.1_EXECUTION_PLAN.md 3.4). `validate-eas-env.js` and `check-env.js` carry
# the same note in their own headers: they only protect when someone remembers.
# This is the "someone remembers" part.
#
# Everything below passes on a clean tree as of 2026-08-24. If a job is red on
# your first run, suspect the runner environment (npm install, Node version)
# before suspecting the code — see the note on the install-dependent jobs.

name: checks

on:
  # Every branch, not just main. Work happens on long-lived feature branches
  # that are pushed directly, so restricting this to PRs would mean no coverage
  # until merge — which is exactly when it stops being cheap to fix.
  push:
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The job this CI exists for ──────────────────────────────────────────────
  # Deliberately installs nothing: `npx deno@2` fetches a pinned Deno, and the
  # functions' own dependencies are resolved by Deno from their npm:/https:
  # specifiers. No package.json, no lockfile, nothing that can drift. If the
  # jobs below break on a runner quirk, this one keeps working.
  edge-functions:
    name: edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-edge-functions.mjs

  # ── Checks with no dependencies of their own ────────────────────────────────
  # Both are plain Node scripts reading files from the repo, so they run without
  # an install. check-env.js's --self-test exercises the validator against
  # fixtures; it does NOT check real environment values, which is correct here —
  # the real check belongs to the Vercel build, where it already runs as
  # `prebuild` and has the actual environment to inspect.
  repo-scripts:
    name: repo config scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: EAS build profiles declare a valid APP_ENV
        run: node ./scripts/validate-eas-env.js
        working-directory: apps/mobile
      - name: Supabase env validator self-test
        run: node scripts/check-env.js --self-test
        working-directory: web

  # ── Type checks (need an install) ───────────────────────────────────────────
  # The only jobs running `npm ci`, and the only place the Node version is
  # load-bearing rather than incidental.
  #
  # web pins **24** to match Vercel's configured nodeVersion (24.x). This is not
  # cosmetic: Node 22 ships npm 10, Node 24 ships npm 11, and the two disagree
  # about this lockfile — npm 10 demands @emnapi/runtime and @emnapi/core
  # entries that npm 11 omits, so `npm ci` fails on 22 and succeeds on 24. CI
  # must install the way production installs, or it is testing a toolchain
  # nobody ships. (mobile stays on 22: it passes there, and EAS's own builders
  # run npm 10.8.2, so 22 is the closer analogue for that package.)
  web:
    name: web typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm install`, not `npm ci`, and this is deliberate.
      #
      # `npm ci` cannot install this tree on ANY npm major. Verified locally
      # against npm 10 and npm 11, with the committed lockfile, with one
      # regenerated by `--package-lock-only`, and with one from a full
      # `npm install` — all four combinations fail the same way:
      #
      #   Missing: @emnapi/runtime@1.11.3 from lock file
      #   Invalid: lock file's @emnapi/wasi-threads@1.2.1 does not satisfy 1.2.3
      #
      # Those are the nested optionalDependencies of
      # @tailwindcss/oxide-wasm32-wasi — Tailwind's WASM fallback, which a
      # linux-x64 runner never executes. It is an upstream npm/Tailwind
      # interaction, not something this repo can fix from its own lockfile.
      # `npm install` resolves it cleanly on both npm majors.
      #
      # The tradeoff is real: this job is no longer lockfile-strict, so a
      # transitive version could drift between runs. Accepted because the job
      # exists to run tsc and eslint, and Vercel's own build does not use
      # `npm ci` either — so this installs closer to how production installs,
      # not further from it. Revisit if the upstream bug is fixed.
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: web
      # 65 warnings, 0 errors, and eslint exits 0 on warnings. Warnings are
      # deliberately not escalated to failures: that is a separate decision from
      # introducing CI, and making this red on day one would defeat the point.
      # (An earlier comment here claimed 2 warnings / 0 errors. That was
      # measured by linting three specific files rather than the project, and
      # the real project lint was failing with 4 errors — two from
      # scripts/check-env.js being told require() is forbidden, two
      # pre-existing setState-in-effect errors in admin/email-preview.)
      - run: npx eslint
        working-directory: web

  mobile:
    name: mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/mobile
