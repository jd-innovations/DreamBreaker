<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1320px;height:2868px;overflow:hidden;background:#F4F3EF;font-family:Newsreader,serif}
.top{height:760px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:100px;text-align:center}
.icon{height:150px;margin-bottom:56px}
h1{font-weight:400;font-size:124px;line-height:1.08;letter-spacing:-1px;color:#0A1228}
.phone{position:absolute;left:50%;top:760px;transform:translateX(-50%);width:1000px;height:2300px;border-radius:120px;background:#0A1228;padding:26px}
.phone img{display:block;width:948px;border-radius:96px}
</style></head><body>
<div class="top"><img class="icon" src="{{ICON}}"><h1>{{HEADLINE}}</h1></div>
<div class="phone"><img src="{{SHOT}}"></div>
</body></html>
