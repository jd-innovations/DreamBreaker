# Opens a deep link, accepts iOS's "Open in app?" prompt if it appears, and
# waits for the screen to settle.
appId: app.pickleballapp
---
- openLink: ${LINK}
# Match the system prompt by its Cancel button too: the tournaments screen has
# its own "Open" filter chip and status badge.
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 5000
