# App Store screenshots, run by .github/workflows/app-store.yml
# (lane: capture-screenshots) on an iPhone 16 Pro Max simulator — 6.9",
# 1320x2868. Signs in as the demo account; EMAIL and PASSWORD come from CI.
# Files sort by name, which is the order App Store Connect shows them in.
appId: app.pickleballapp
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# A cold Release launch on a CI simulator spends well over Maestro's default
# few seconds on the splash spinner (expo-updates checks for an OTA first).
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 120000
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "you@email.com"
    timeout: 30000
- tapOn: "you@email.com"
- inputText: ${EMAIL}
# "Password" is both the field's label and its placeholder, and a text tap
# lands on the label, so the password went nowhere (run #9). Tap the input
# box itself: on this simulator (6.9", fixed in the workflow) it sits at 44%
# — but only with the keyboard down; with it up the form slides and 44% is
# the Sign In button (run #10). Return on the password field signs in.
- hideKeyboard
- tapOn:
    point: "50%,44%"
- inputText: ${PASSWORD}
- pressKey: Enter
# Not the email placeholder: it is already hidden once the email is typed.
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 30000
# iOS offers to save the password and the sheet covers every screenshot.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 00-home

# Tabs are tapped, not deep-linked: pickleballapp://games landed on Home
# (run #12). Bar order on this 6.9" simulator, y = 94%: Home 13%, Nearby 31%,
# Events 50%, Partner 68%, Profile 87%. Points, because the labels also appear
# as text on other screens. Tabs first, while the bar is on screen.
- tapOn: { point: "50%,94%" }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: 01-events

- tapOn: { point: "68%,94%" }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: 03-finder

- tapOn: { point: "87%,94%" }
- waitForAnimationToEnd: { timeout: 5000 }
- takeScreenshot: 06-profile

# Not tabs, so deep links.
- runFlow: { file: open.yaml, env: { LINK: "pickleballapp://tournaments" } }
# The card is one accessible element ("Open, FUTURES CLASSIC, Tennis…"),
# upper-cased, and Maestro matches the whole string.
- extendedWaitUntil:
    visible: "(?i).*futures classic.*"
    timeout: 30000
- tapOn: "(?i).*futures classic.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-tournament

- runFlow: { file: open.yaml, env: { LINK: "pickleballapp://chat" } }
- takeScreenshot: 04-chat

- runFlow: { file: open.yaml, env: { LINK: "pickleballapp://stats" } }
- takeScreenshot: 05-stats
