# Rafter suppressions. Each entry is a finding triaged as a false positive, with
# the evidence. Paths are listed one by one on purpose: a new file with a real
# secret or a real injection must still be reported. Triaged 2026-09-29 from
# scan e21ad434-0e17-478f-a1de-533239557bcb.

ignore:
  # The Supabase ANON key (JWT role "anon", project fbzetvkbhneptvfruilw). It is
  # public by design: every browser and app build carries it, and RLS is the
  # access control. pg_cron/pg_net jobs send it as the Bearer to edge functions;
  # functions that must not be callable with it check the Vault dispatch secret
  # instead (email-gate.ts). Nothing to rotate.
  - paths:
      - "apps/mobile/scripts/groups-smoke-test.js"
      - "supabase/_baseline/pre_par_apply_public_schema.sql"
      - "supabase/_baseline/pre_repair_full_schema_inventory.sql"
      - "supabase/_baseline/preview_full_schema_inventory.sql"
      - "supabase/_baseline/preview_public_schema.sql"
      - "supabase/_baseline/0009_full_schema_inventory.sql"
      - "supabase/_baseline/0001_public_schema.sql"
      - "supabase/_baseline/post_repair_full_schema_inventory.sql"
      - "supabase/migrations/20260725000000_baseline_from_prod.sql"
      - "supabase/migrations/20260807020000_schedule_waitlist_sweeper.sql"
      - "supabase/migrations/20260831010100_schedule_push_receipt_sweeper.sql"
      - "supabase/migrations/20260807000000_transactional_email.sql"
      - "supabase/migrations/20260831020000_preference_aware_push.sql"
      - "supabase/migrations/20260901043023_schedule_coach_payout_runner.sql"
      - "supabase/migrations/20260901220000_schedule_facility_payout_runner.sql"
      - "supabase/migrations/20260921120000_block_enforcement.sql"
      - "supabase/migrations/20260909230000_marketplace_price_drop_notifications.sql"
      - "supabase/migrations/20260921180000_push_dispatch_secret.sql"
      - "supabase/migrations_legacy/20260708010000_push_notifications.sql"
    rules: ["R-FC93C"]
    reason: "Public Supabase anon key (role anon), not a secret; RLS is the control."

  # selfTest() fixtures: truncated fake JWTs ("eyJhbGciO..."), no signature, no project.
  - paths: ["web/scripts/check-env.js"]
    rules: ["R-9D881"]
    reason: "Fake placeholder JWTs in the env checker's self-test."

  # Line 65 is bearerOf(): a regex over the Authorization header. No SQL is built there.
  - paths: ["supabase/functions/_shared/email-gate.ts"]
    rules: ["R-4C258"]
    reason: "No SQL sink; the flagged line parses a header with a regex."

  # Local build script: imports a temp file it just wrote from the repo's own email-shell.ts.
  - paths: ["supabase/templates/auth/render.mjs"]
    rules: ["R-6FBD5"]
    reason: "Import path is generated by the script itself, not user input; dev-only."

  # Math.random() only makes a Realtime channel name unique per subscription. Not a token.
  - paths: ["web/src/lib/tournament/live-brackets.ts", "apps/mobile/src/hooks/useTournamentLive.ts"]
    rules: ["R-310C9"]
    reason: "Random suffix on a Realtime channel name; not security-sensitive."
